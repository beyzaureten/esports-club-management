<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change Password - ESports Club</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
<div class="login-page">
    <div class="login-card">

        <div class="login-logo-box">
            <img th:src="@{/images/logo.png}" alt="ESports Club Logo" class="login-logo-img">
        </div>

        <p class="login-sub">Change Your Password</p>

        <div class="auth-warning-box">
            <p class="auth-warning-title">⚠️ You are using a temporary password!</p>
            <p class="auth-warning-text">You must change your password before continuing.</p>
        </div>

        <div th:if="${error}" class="error-login" th:text="${error}"></div>

        <form th:action="@{/change-password}" method="post">
            <div class="input-wrap">
                <input name="newPassword" id="newPasswordInput" type="password" placeholder="New password (min 6 characters)" />
                <span class="input-icon" onclick="toggleNew()">👁️</span>
            </div>

            <div class="input-wrap">
                <input name="confirmPassword" id="confirmPasswordInput" type="password" placeholder="Confirm new password" />
                <span class="input-icon" onclick="toggleConfirm()">👁️</span>
            </div>

            <button class="login-btn" type="submit">Change Password</button>
        </form>

        <p class="auth-logged-user">
            Logged in as:
            <span th:text="${loggedUser?.username}">user</span>
        </p>
    </div>
</div>

<script>
    function toggleNew() {
        const input = document.getElementById('newPasswordInput');
        input.type = input.type === 'password' ? 'text' : 'password';
    }

    function toggleConfirm() {
        const input = document.getElementById('confirmPasswordInput');
        input.type = input.type === 'password' ? 'text' : 'password';
    }
</script>
</body>
</html>
