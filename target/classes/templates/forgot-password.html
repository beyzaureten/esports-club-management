<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - ESports Club</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
<div class="login-page">
    <div class="login-card">

        <div class="login-logo-box">
            <img th:src="@{/images/logo.png}" alt="ESports Club Logo" class="login-logo-img">
        </div>

        <p class="login-sub">Password Reset</p>

        <div th:if="${error}" class="error-login" th:text="${error}"></div>

        <div th:if="${success}" class="auth-success-box">
            <p class="auth-success-title">✅ Temporary password created!</p>
            <p class="auth-success-text">
                Username:
                <span class="auth-highlight" th:text="${username}"></span>
            </p>
            <p class="auth-success-text">
                Temp password:
                <span class="auth-highlight auth-password" th:text="${tempPassword}"></span>
            </p>
            <p class="auth-success-note">Please change your password after logging in!</p>
        </div>

        <form th:if="${success == null}" th:action="@{/forgot-password}" method="post">
            <div class="input-wrap">
                <input name="email" type="email" placeholder="Your email address" />
            </div>

            <button class="login-btn" type="submit">Reset Password</button>
        </form>

        <p class="forgot" style="margin-top:16px;">
            <a th:href="@{/login}">← Back to Login</a>
        </p>
    </div>
</div>
</body>
</html>
