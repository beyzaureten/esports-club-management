<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - ESports Club</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
<div class="login-page">
    <div class="login-card">

        <div class="login-logo-box">
            <img th:src="@{/images/logo.png}" alt="ESports Club Logo" class="login-logo-img">
        </div>

        <p class="login-sub">Management System — Sign In</p>

        <div class="role-row">
            <div class="role-chip active" onclick="setRole('ADMIN', this)">Admin</div>
            <div class="role-chip" onclick="setRole('COACH', this)">Coach</div>
            <div class="role-chip" onclick="setRole('MEMBER', this)">Member</div>
        </div>

        <div th:if="${error}" class="error-login" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" name="selectedRole" id="selectedRole" value="ADMIN" />

            <div class="input-wrap">
                <input name="username" placeholder="Username" autocomplete="off" />
            </div>

            <div class="input-wrap">
                <input name="password" id="passwordInput" type="password" placeholder="Password" />
                <span class="input-icon" id="eyeIcon" onclick="togglePassword()">👁️</span>
            </div>

            <button class="login-btn" type="submit">Sign In</button>
        </form>

        <p class="forgot">
            <a th:href="@{/forgot-password}">Forgot your password?</a>
            &nbsp;·&nbsp;
            <a th:href="@{/register}">Sign Up</a>
        </p>
    </div>
</div>

<script>
    function setRole(role, el) {
        document.getElementById('selectedRole').value = role;
        document.querySelectorAll('.role-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
    }

    function togglePassword() {
        const input = document.getElementById('passwordInput');
        const icon = document.getElementById('eyeIcon');

        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = '🙈';
        } else {
            input.type = 'password';
            icon.textContent = '👁️';
        }
    }
</script>
</body>
</html>
